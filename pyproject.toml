[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-chatbot"
version = "0.1.0"
description = "Conversational research data dictionary assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Pinned to compatible-release (~=) to prevent silent CVE auto-upgrades.
  # Update intentionally; run `pip-audit` after each bump.
  "streamlit~=1.55.0",
  "fastapi~=0.135.0",
  "uvicorn~=0.42.0",
  "gunicorn~=25.3.0",
  "httpx~=0.28.0",
  "pandas~=2.3.0",
  "openpyxl~=3.1.0",
  "scikit-learn~=1.8.0",
  "numpy~=2.4.0",
  "python-dotenv~=1.2.0",
  "openai~=2.26.0",
  "slowapi~=0.1.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

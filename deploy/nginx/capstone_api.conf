upstream capstone_api {
    least_conn;
    keepalive 128;

    server 127.0.0.1:8001 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://capstone_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}

# PMG Intelligence — NGINX reverse proxy configuration
#
# Local dev:  upstream points to docker compose service "api"
# Production: replace "api" with your load-balancer hostname or K8s service DNS
#
# TLS certs:
#   Dev:  openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#               -keyout deploy/nginx/certs/pmg.key \
#               -out    deploy/nginx/certs/pmg.crt \
#               -subj "/CN=localhost"
#   Prod: cert-manager (K8s) or ACM (AWS ALB) — terminate TLS at the load balancer

upstream capstone_api {
    least_conn;
    keepalive 128;

    # Docker compose: single container exposed as service "api"
    # Production K8s: replace with service ClusterIP or headless DNS
    server api:8000 max_fails=3 fail_timeout=15s;
}

upstream capstone_ui {
    server ui:8501 max_fails=3 fail_timeout=15s;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS — API + UI ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # TLS — mount certs at deploy/nginx/certs/ (see comment above)
    ssl_certificate     /etc/ssl/pmg/pmg.crt;
    ssl_certificate_key /etc/ssl/pmg/pmg.key;

    # Modern TLS only (drops TLS 1.0/1.1)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip for API JSON responses
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # ── API routes ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://capstone_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    65s;
        proxy_send_timeout    65s;
    }

    # ── Health probe (no auth — load balancer target) ─────────────────────────
    location /health {
        proxy_pass         http://capstone_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        access_log off;     # suppress health check log noise
    }

    # ── Streamlit UI ─────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://capstone_ui;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";   # WebSocket for Streamlit
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # Streamlit SSE streams need long timeout
    }
}

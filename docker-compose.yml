version: "3.9"

# PMG Intelligence — local development stack
#
# Usage:
#   1. Copy .env.example → .env.local and fill in secrets
#   2. docker compose up --build
#   3. UI: http://localhost:8501   API: http://localhost:8000
#
# Production:
#   Override env vars via CI/CD secrets injection or cloud secrets manager.
#   Never use .env.local in production — inject all secrets as env vars.

services:

  # ── API (FastAPI + Gunicorn) ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local        # gitignored — copy from .env.example; never use .env
    environment:
      API_BIND: "0.0.0.0:8000"
      EXCEL_SOURCE_PATH: "/app/data/market_research_capstone_draft_1.xlsx"
      INDEX_CACHE_DIR: "/app/data/cache"
      OBSERVABILITY_DB_PATH: "/app/data/observability.db"
      LOGS_DIR: "/app/data/logs"
    ports:
      - "8000:8000"
    volumes:
      - pmg_data:/app/data    # persist index cache, SQLite DB, event logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 40s       # allow index warm-up time
      retries: 3
    restart: unless-stopped

  # ── UI (Streamlit) ──────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_BASE_URL: "http://api:8000"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Reverse Proxy (NGINX) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/capstone_api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/ssl/pmg:ro   # mount TLS certs (see deploy/nginx/README)
    depends_on:
      - api
      - ui
    restart: unless-stopped

volumes:
  pmg_data:
    driver: local
